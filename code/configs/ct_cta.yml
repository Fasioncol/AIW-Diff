data:
    dataset: "CT_CTA"
    image_size: 512
    num_workers: 4

model:
    type: "hybrid"

    complexity_strength: 0.1

    in_channels: 2
    out_ch: 1
    ch: 128
    ch_mult: [1, 2, 4, 4]
    num_res_blocks: 2
    attn_resolutions: [32]
    dropout: 0.1
    ema_rate: 0.9999
    ema: True
    resamp_with_conv: True

    wavelet:
        use_wavelet: true
        wavelet_type: 'haar'
        gate_bias: 1.0

    vit:
        patch_size: 4
        num_heads: 8
        depth: 12

    ib_mlp:
        z_dim: 1024
        loss_weight: 0.0001

    eabc:
        use: true
        loss_weight: 0.001
        l1_loss_weight: 1.0

diffusion:
    beta_schedule: "linear"
    beta_start: 0.0001
    beta_end: 0.02
    num_diffusion_timesteps: 1000

training:
    batch_size: 1
    n_epochs: 10000
    snapshot_freq: 5000
    val_data_dir: "./data/val"
    val_num_samples: 2
    val_timesteps: 100
    val_eta: 0.0

    speed:
        use: true
        lam: 8
        k: 5
        wp_strength: 0.1

optim:
    weight_decay: 0.000
    optimizer: "Adam"
    lr: 0.00002
    beta1: 0.9
    amsgrad: false
    eps: 0.00000001
    grad_clip: 1.0
